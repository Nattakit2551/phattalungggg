<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนที่นำทาง — พัทลุงไกด์</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="nav-page-body">
    <div class="nav-control-bar">
        <div class="nav-bar-title">
            <a href="ai.html" class="btn-action-icon" title="กลับ"><i class="fa-solid fa-arrow-left"></i></a>
            <div style="min-width: 0;">
                <span class="eyebrow" style="font-size: 0.6rem;">กำลังนำทาง</span>
                <strong id="navPageTitle">แผนที่นำทาง</strong>
            </div>
        </div>
        <div class="nav-bar-actions">
            <button class="btn btn-outline btn-sm" onclick="toggleStepListModal()"><i class="fa-solid fa-list-ol"></i> <span class="sr-only">ดู</span>วิธีเลี้ยว</button>
            <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-house"></i></a>
        </div>
    </div>

    <div class="dedicated-map-wrapper">
        <div id="dedicatedNavMap"></div>

        <div class="dedicated-floating-hud" id="dedicatedFloatingHud">
            <div class="hud-head">
                <strong id="dedicatedHudTitle">กำลังเตรียมเส้นทาง...</strong>
                <button class="btn-action-icon" id="btnDedHudToggle" onclick="toggleDedicatedHudCollapse()" style="width: 30px; height: 30px;">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>
            <div class="hud-mini-body">
                <div class="hud-metrics">
                    <div class="hud-metric"><small>ระยะทาง</small><b id="dedHudDist">-</b></div>
                    <div class="hud-metric"><small>เวลาโดยประมาณ</small><b id="dedHudTime">-</b></div>
                </div>
                <div class="hud-actions">
                    <button class="btn-hud-sm primary" id="btnDedicatedLiveNav" onclick="toggleDedicatedLiveNav()">
                        <i class="fa-solid fa-play"></i> เริ่มนำทางสด
                    </button>
                    <button class="btn-hud-sm" onclick="locateDedicatedUser()">
                        <i class="fa-solid fa-crosshairs"></i> ตำแหน่งฉัน
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="navStepsModal" onclick="if(event.target===this) this.classList.remove('active')">
        <div class="modal-box" style="max-width: 520px;" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="document.getElementById('navStepsModal').classList.remove('active')" aria-label="ปิด"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-body">
                <span class="eyebrow">ทีละขั้นตอน</span>
                <h2 class="mt-2 mb-3">วิธีเลี้ยวตลอดเส้นทาง</h2>
                <div class="turn-steps-list" id="navStepsList"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
